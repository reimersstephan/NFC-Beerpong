<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍺 NFC Beerpong</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1a1a1a, #451414);
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

h1 {
    margin-bottom: 25px;
    font-size: clamp(2rem, 6vw, 3.5rem);
}

.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 30px;
    padding: 40px 25px;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(255,255,255,0.08);
}

#task {
    font-size: clamp(2.2rem, 8vw, 4.5rem);
    font-weight: bold;
    line-height: 1.25;
    text-align: center;
    word-break: break-word;
}

button {
    margin-top: 25px;
    border: none;
    border-radius: 50px;
    padding: 18px 35px;
    font-size: 1.4rem;
    font-weight: bold;
    background: #ff9800;
    color: white;
    cursor: pointer;
}

.status {
    margin-top: 15px;
    opacity: 0.7;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<div class="container">

    <h1>🍺 NFC Beerpong</h1>

    <div class="card">
        <div id="task">Lade Aufgaben...</div>
    </div>

    <button onclick="loadTask()">
        🎲 Neue Aufgabe
    </button>

    <div class="status" id="status"></div>

</div>

<script>
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1FWVfPG2LB5BEzg2uAtNKdIzurzK7lGXqB9Emix3OVx0/gviz/tq?tqx=out:csv";

let tasks = [];
let shuffledTasks = [];
let currentIndex = 0;

async function loadTasks() {
    try {
        const response = await fetch(SHEET_URL);
        const csv = await response.text();

        tasks = csv
            .split("\n")
            .slice(1)
            .map(row => row.replace(/"/g, "").trim())
            .filter(Boolean);

        document.getElementById("status").textContent =
            `${tasks.length} Aufgaben geladen`;

        shuffleTasks();
        loadTask();

    } catch (error) {
        document.getElementById("task").textContent =
            "Fehler beim Laden";
    }
}

function shuffleTasks() {
    // Kopie der Aufgaben erzeugen
    shuffledTasks = [...tasks];

    // Fisher-Yates Shuffle
    for (let i = shuffledTasks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledTasks[i], shuffledTasks[j]] =
        [shuffledTasks[j], shuffledTasks[i]];
    }

    currentIndex = 0;
}

function loadTask() {

    if (shuffledTasks.length === 0)
        return;

    // Wenn alle Aufgaben einmal gezeigt wurden,
    // erneut mischen
    if (currentIndex >= shuffledTasks.length) {
        shuffleTasks();
    }

    document.getElementById("task").textContent =
        shuffledTasks[currentIndex];

    currentIndex++;
}

loadTasks();
</script>

</body>
</html>
