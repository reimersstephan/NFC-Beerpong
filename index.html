<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1a1a1a, #2c0f0f);
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    text-align: center;
    width: 90%;
    max-width: 600px;
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 30px;
}

.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 40px 25px;
    box-shadow: 0 0 30px rgba(255,255,255,0.08);
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#task {
    font-size: 2rem;
    font-weight: bold;
    line-height: 1.4;
}

button {
    margin-top: 30px;
    border: none;
    border-radius: 50px;
    padding: 15px 30px;
    font-size: 1.1rem;
    cursor: pointer;
    background: #ff9800;
    color: white;
    font-weight: bold;
    transition: transform .2s;
}

button:hover {
    transform: scale(1.05);
}

.shuffle {
    animation: pulse .1s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.03);
    }
}
</style>

<div class="container">
    <h1>🍺 NFC Beerpong</h1>

    <div class="card">
        <div id="task">Bereit?</div>
    </div>

    <button onclick="loadTask()">
        🎲 Aufgabe ziehen
    </button>
</div>

<script>
let tasks = [
    "Alle trinken!",
    "2 Schlücke trinken",
    "Wähle einen Spieler",
    "Shot Challenge",
    "Linker Nachbar trinkt"
];

function loadTask() {
    const taskElement = document.getElementById("task");

    taskElement.classList.add("shuffle");

    let count = 0;

    const interval = setInterval(() => {
        taskElement.textContent =
            tasks[Math.floor(Math.random() * tasks.length)];

        count++;

        if (count > 20) {
            clearInterval(interval);

            taskElement.classList.remove("shuffle");

            taskElement.textContent =
                tasks[Math.floor(Math.random() * tasks.length)];
        }
    }, 80);
}
</script>
