<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>NFC Beerpong</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #111;
      color: white;
      padding-top: 80px;
    }

    #task {
      font-size: 2rem;
      margin-top: 40px;
    }

    button {
      margin-top: 40px;
      padding: 15px 25px;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>

  <h1>🍺 NFC Beerpong</h1>

  <div id="task">Lade Aufgabe...</div>

  <button onclick="loadTask()">Neue Aufgabe</button>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1FWVfPG2LB5BEzg2uAtNKdIzurzK7lGXqB9Emix3OVx0/gviz/tq?tqx=out:csv";

    let tasks = [];

    async function loadTasks() {
      const res = await fetch(SHEET_URL);
      const text = await res.text();

      tasks = text
        .split("\n")
        .slice(1) // Kopfzeile raus
        .map(row => row.replace(/"/g, "").trim())
        .filter(Boolean);
    }

    function loadTask() {
      if (tasks.length === 0) return;

      const random = tasks[Math.floor(Math.random() * tasks.length)];
      document.getElementById("task").innerText = random;
    }

    async function init() {
      await loadTasks();
      loadTask();
    }

    init();
  </script>

</body>
</html>
