<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC-Beerpong</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}
.container { padding: 20px; max-width: 700px; }
#title { font-size: 2rem; margin-bottom: 30px; }
#spinner { font-size: 4rem; animation: pulse 0.8s infinite; }
#task { display:none; font-size:2rem; line-height:1.4; animation: fadeIn 1s; }
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}
@keyframes fadeIn {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>
<div class="container">
    <div id="title">🍺 NFC-Pingpong 🍺</div>
    <div id="spinner">
        🎯
        <div style="font-size:1.2rem;margin-top:20px;">Aufgabe wird gezogen...</div>
    </div>
    <div id="task"></div>
</div>

<script>
const aufgaben = [
"🎤 Sprich bis zu deinem nächsten Wurf mit Radiomoderator-Stimme.",
"🦖 Laufe einmal um den Tisch wie ein Dinosaurier.",
"🤐 Du darfst eine Runde lang nur mit Ja oder Nein antworten.",
"🎬 Stelle einen bekannten Film pantomimisch dar.",
"👑 Wähle jemanden zum König des Tisches bis zum nächsten Treffer.",
"🐔 Mache 10 Sekunden lang Hühnergeräusche.",
"🕺 Führe einen 15-sekündigen Siegestanz auf.",
"🎭 Sprich die nächsten drei Sätze dramatisch wie in einer Soap-Opera.",
"🤖 Bewege dich bis zu deinem nächsten Wurf wie ein Roboter.",
"🎤 Die Gruppe gibt dir ein Wort vor, daraus musst du sofort einen Rap machen.",
"🙈 Trinke deinen nächsten Schluck mit geschlossenen Augen.",
"🧠 Nenne innerhalb von 10 Sekunden fünf Dinge einer vorgegebenen Kategorie.",
"📸 Pose für ein imaginäres Magazin-Cover.",
"🏆 Du erhältst den Titel Profi und musst jeden Satz mit 'Als Profi kann ich sagen...' beginnen.",
"🎶 Summe ein Lied, die anderen müssen es erraten.",
"🦩 Stehe bis zum nächsten Wurf auf einem Bein.",
"🎤 Die Gruppe bestimmt deinen Spitznamen für die nächsten 10 Minuten.",
"🧙 Sprich bis zur nächsten Runde wie ein Zauberer.",
"🤝 Wähle zwei Personen, die sich gegenseitig ein Kompliment machen müssen.",
"🎯 Du darfst einem Mitspieler eine harmlose Zusatzregel für die nächste Runde geben."
];

const zufall = aufgaben[Math.floor(Math.random() * aufgaben.length)];

setTimeout(() => {
    document.getElementById("spinner").style.display = "none";
    const task = document.getElementById("task");
    task.innerHTML = zufall;
    task.style.display = "block";
}, 2500);
</script>
</body>
</html>
